# yaml-language-server: $schema=https://devenv.sh/devenv.schema.json
inputs:
  devenv:
    url: github:cachix/devenv/main
    inputs:
      nixpkgs:
        follows: nixpkgs
  nixpkgs:
    url: github:cachix/devenv-nixpkgs/rolling
  treefmt-nix:
    url: github:numtide/treefmt-nix
    inputs:
      nixpkgs:
        follows: nixpkgs
allow_unfree: true
secretspec:
  enable: true
  profile: default
  provider: keyring
